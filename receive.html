<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1kH8HErbms_U0xnoiJ7jlW7r79FK3hXeB">
    <title>ยืนยันการรับอะไหล่ - TSC System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f1f5f9;
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden animate-fadeIn">
        <!-- Brand Header -->
        <div class="bg-gradient-to-r from-cyan-500 to-teal-600 p-6 text-center text-white relative">
            <div class="absolute top-4 left-4 bg-white/20 px-2 py-1 rounded-lg text-xs font-mono backdrop-blur-sm">
                PUBLIC VIEW
            </div>
            <div class="flex justify-center mb-2">
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-md">
                    <img src="https://lh3.googleusercontent.com/d/1b_e-SYaUDdlZqzyAwanUcYhaTx9inclg" alt="TSC Logo" class="h-10 rounded-md">
                </div>
            </div>
            <h1 class="text-lg font-bold">ระบบยืนยันการรับอะไหล่</h1>
            <p class="text-xs text-cyan-100">ฝ่ายสนับสนุนทางเทคนิค บริษัท พีรพัฒน์ เทคโนโลยี จำกัด (มหาชน)</p>
        </div>

        <!-- Main Display Container -->
        <div id="content-loading" class="p-8 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-cyan-500 border-t-transparent mb-2"></div>
            <p class="text-gray-500 text-sm">กำลังดึงข้อมูลเอกสาร...</p>
        </div>

        <div id="content-container" class="hidden p-6 space-y-6">
            <!-- Summary Info -->
            <div class="border-b pb-4 space-y-2 text-sm">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">เลขที่เอกสาร:</span>
                    <span id="doc-id-display" class="font-mono font-bold text-gray-800"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">สถานะจัดส่ง:</span>
                    <span id="shipping-status-badge"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">ลูกค้า:</span>
                    <span id="customer-name-display" class="font-semibold text-gray-800 text-right"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">ผู้ส่งคำขอ:</span>
                    <span id="requester-name-display" class="text-gray-800"></span>
                </div>
                <div id="tracking-container" class="flex justify-between items-center hidden">
                    <span class="text-gray-500">เลขพัสดุ:</span>
                    <span id="tracking-display" class="font-mono text-gray-800"></span>
                </div>
            </div>

            <!-- Items Table -->
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">รายการอะไหล่</h3>
                <div class="border rounded-xl overflow-hidden bg-slate-50/50">
                    <table class="w-full">
                        <thead>
                            <tr class="text-xs text-gray-400 border-b bg-slate-50 text-left">
                                <th class="p-3 font-medium">ชื่ออะไหล่</th>
                                <th class="p-3 font-medium text-center">รหัส</th>
                                <th class="p-3 font-medium text-right">จำนวน</th>
                            </tr>
                        </thead>
                        <tbody id="parts-tbody">
                            <!-- Items rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Shipping Notes -->
            <div id="shipment-notes-container" class="hidden p-3 bg-amber-50 border border-amber-100 rounded-xl text-xs text-amber-800">
                <strong>หมายเหตุการจัดส่ง:</strong>
                <p id="shipment-notes-display" class="mt-1 font-medium"></p>
            </div>

            <!-- Shipping Images / Photos -->
            <div id="shipping-photos-container" class="hidden">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">รูปภาพการจัดส่ง</h3>
                <div id="shipping-photos-grid" class="grid grid-cols-3 gap-2">
                    <!-- Images will be injected here -->
                </div>
            </div>

            <!-- Action Form Container -->
            <div id="action-form-container" class="space-y-4 pt-2 border-t">
                <!-- Preview area -->
                <div id="photo-preview-container" class="hidden border-2 border-dashed border-slate-200 rounded-xl p-2 relative">
                    <img id="photo-preview-img" src="" alt="พรีวิวภาพถ่าย" class="w-full h-48 object-cover rounded-lg">
                    <button id="remove-photo-btn" class="absolute top-4 right-4 bg-red-500 hover:bg-red-600 text-white rounded-full p-2 shadow-lg transition-transform active:scale-95">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Input Trigger Buttons -->
                <div class="flex gap-2">
                    <button id="trigger-camera-btn" class="flex-1 btn bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl border border-slate-200 font-medium flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
                        <i data-lucide="camera" class="w-5 h-5 text-slate-500"></i>
                        <span>ถ่ายรูปสินค้า / เลือกรูป</span>
                    </button>
                    <input type="file" id="camera-file-input" accept="image/*" capture="environment" class="hidden">
                </div>

                <!-- Submit Button -->
                <button id="submit-confirm-btn" disabled class="w-full btn bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-green-200 hover:shadow-lg active:scale-[0.98]">
                    <i data-lucide="package-check" class="w-5 h-5"></i>
                    <span>ยืนยันการรับสินค้า</span>
                </button>
            </div>

            <!-- Already Received Success Banner -->
            <div id="received-success-banner" class="hidden p-5 bg-green-50 border border-green-200 rounded-2xl text-center space-y-2 animate-fadeIn">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full">
                    <i data-lucide="check-circle" class="w-6 h-6"></i>
                </div>
                <h4 class="text-green-800 font-bold">ได้รับสินค้าเรียบร้อยแล้ว</h4>
                <p id="received-time-display" class="text-xs text-green-600"></p>
            </div>
        </div>
    </div>

    <!-- Core App Logic -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwpecytkGbvIbu6Q8Pc4oWU3pSrA6fzMPgRNLacyDwkw91P1Hs8vAN2_8s9OCkpe_vbqA/exec";
        const FIREBASE_DB_URL = "https://pk-tank-393ee-default-rtdb.asia-southeast1.firebasedatabase.app";

        // Global State
        let documentDetails = null;
        let selectedImageBase64 = null;

        // Parse docId from URL
        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('docId');

        // Initializer
        window.addEventListener('DOMContentLoaded', () => {
            if (!docId) {
                showError("ผิดพลาด", "ไม่พบเลขที่เอกสารในลิงก์");
                return;
            }
            fetchDocumentData(docId);
            setupEventListeners();
        });

        // Fetch Document Details
        function fetchDocumentData(id) {
            fetch(`${FIREBASE_DB_URL}/Documents/${id}.json`)
                .then(res => res.json())
                .then(doc => {
                    if (!doc) {
                        showError("ไม่พบข้อมูล", `ไม่พบเอกสารเลขที่ ${id} ในระบบ`);
                        return;
                    }
                    documentDetails = doc;
                    renderDocumentDetails(doc);
                })
                .catch(err => {
                    console.error("Fetch document error:", err);
                    showError("ข้อผิดพลาด", "เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล");
                });
        }

        // Render document variables to DOM
        function renderDocumentDetails(doc) {
            document.getElementById('content-loading').classList.add('hidden');
            const container = document.getElementById('content-container');
            container.classList.remove('hidden');

            document.getElementById('doc-id-display').textContent = doc.DocID;
            document.getElementById('customer-name-display').textContent = doc.CustomerName || '-';
            document.getElementById('requester-name-display').textContent = doc.RequesterName || '-';

            // Tracking details
            if (doc.TrackingNumber) {
                document.getElementById('tracking-container').classList.remove('hidden');
                document.getElementById('tracking-display').textContent = doc.TrackingNumber;
            }

            // Render shipping status badge
            const status = doc.ShippingStatus || 'รอจัดส่ง';
            const badge = document.getElementById('shipping-status-badge');
            badge.textContent = status;
            
            const badgeClasses = {
                'รอจัดส่ง': 'bg-slate-100 text-slate-800 border-slate-200',
                'กำลังจัดส่ง': 'bg-blue-50 text-blue-700 border-blue-100',
                'จัดส่งแล้ว': 'bg-amber-50 text-amber-700 border-amber-100',
                'ได้รับแล้ว': 'bg-green-50 text-green-700 border-green-100'
            };
            badge.className = `px-3 py-1 border rounded-full text-xs font-bold ${badgeClasses[status] || 'bg-slate-100'}`;

            // Render Shipment Notes
            if (doc.ShipmentNotes) {
                document.getElementById('shipment-notes-container').classList.remove('hidden');
                document.getElementById('shipment-notes-display').textContent = doc.ShipmentNotes;
            }

            // Render existing shipment images
            let shipmentImages = [];
            try {
                if (doc.ShipmentImagesJSON) {
                    shipmentImages = JSON.parse(doc.ShipmentImagesJSON);
                }
            } catch (e) {
                console.error("Error parsing shipment images:", e);
            }

            if (shipmentImages.length > 0) {
                const grid = document.getElementById('shipping-photos-grid');
                grid.innerHTML = '';
                shipmentImages.forEach((url, i) => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = `รูปภาพจัดส่ง ${i+1}`;
                    img.className = 'w-full h-16 object-cover rounded-lg border border-slate-200 cursor-pointer hover:opacity-85 transition-opacity';
                    img.addEventListener('click', () => {
                        Swal.fire({
                            imageUrl: url,
                            imageAlt: `รูปภาพจัดส่ง ${i+1}`,
                            showCloseButton: true,
                            showConfirmButton: false,
                            className: 'max-w-full'
                        });
                    });
                    grid.appendChild(img);
                });
                document.getElementById('shipping-photos-container').classList.remove('hidden');
            }

            // Render items table
            let items = [];
            try {
                items = typeof doc.ItemsJSON === 'string' ? JSON.parse(doc.ItemsJSON) : (doc.Items || doc.items || []);
            } catch (e) {
                items = [];
            }

            const tbody = document.getElementById('parts-tbody');
            tbody.innerHTML = '';
            
            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-sm text-gray-400">ไม่มีรายการอะไหล่</td></tr>';
            } else {
                items.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b last:border-0 text-sm';
                    tr.innerHTML = `
                        <td class="p-3 text-gray-800 font-medium">${item.name}</td>
                        <td class="p-3 text-center text-gray-600 font-mono text-xs">${item.code}</td>
                        <td class="p-3 text-right text-gray-800 font-semibold">${item.qty} ชิ้น</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Handle UI based on receipt status
            if (status === 'ได้รับแล้ว') {
                document.getElementById('action-form-container').classList.add('hidden');
                document.getElementById('received-success-banner').classList.remove('hidden');
                document.getElementById('received-time-display').textContent = `ได้รับเมื่อ: ${formatDateTime(doc.ReceivedTimestamp)}`;
            } else {
                document.getElementById('action-form-container').classList.remove('hidden');
                document.getElementById('received-success-banner').classList.add('hidden');
            }

            // Render Lucide icons
            lucide.createIcons();
        }

        // Setup DOM event listeners
        function setupEventListeners() {
            const triggerBtn = document.getElementById('trigger-camera-btn');
            const fileInput = document.getElementById('camera-file-input');
            const removeBtn = document.getElementById('remove-photo-btn');
            const submitBtn = document.getElementById('submit-confirm-btn');

            triggerBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                Swal.fire({
                    title: 'กำลังย่อขนาดรูปภาพ...',
                    allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading(); }
                });

                compressImage(file, 800, 800, 0.7, (base64) => {
                    Swal.close();
                    selectedImageBase64 = base64;
                    
                    // Display preview
                    document.getElementById('photo-preview-img').src = base64;
                    document.getElementById('photo-preview-container').classList.remove('hidden');
                    
                    // Toggle buttons
                    submitBtn.disabled = false;
                });
            });

            removeBtn.addEventListener('click', () => {
                selectedImageBase64 = null;
                fileInput.value = '';
                document.getElementById('photo-preview-container').classList.add('hidden');
                submitBtn.disabled = true;
            });

            submitBtn.addEventListener('click', () => {
                if (!selectedImageBase64) return;
                confirmReceiptSubmit();
            });
        }

        // Handle receipt submission
        async function confirmReceiptSubmit() {
            Swal.fire({
                title: 'กำลังบันทึกข้อมูล...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const timestamp = new Date().toISOString();
                let uploadLinks = [];

                // 1. Upload compressed image to Google Drive via Apps Script API
                const gasRes = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'uploadShipmentImages',
                        payload: {
                            docId: docId,
                            images: [selectedImageBase64]
                        }
                    }),
                    mode: 'cors',
                    credentials: 'omit'
                });

                const gasText = await gasRes.text();
                const gasResult = JSON.parse(gasText);

                if (gasResult && gasResult.success && gasResult.data && gasResult.data.imageLinks) {
                    uploadLinks = gasResult.data.imageLinks;
                }

                // 2. Query existing photos
                let existingImages = [];
                try {
                    if (documentDetails.ShipmentImagesJSON) {
                        existingImages = JSON.parse(documentDetails.ShipmentImagesJSON);
                    }
                } catch (e) {}

                const allImages = existingImages.concat(uploadLinks);

                // 3. Patch Document properties in Firebase Realtime Database
                const patchData = {
                    ShippingStatus: 'ได้รับแล้ว',
                    ReceivedTimestamp: timestamp,
                    ShipmentImagesJSON: JSON.stringify(allImages)
                };

                const patchRes = await fetch(`${FIREBASE_DB_URL}/Documents/${docId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(patchData)
                });

                if (!patchRes.ok) {
                    throw new Error("Failed to patch Firebase database node.");
                }

                // 4. Send Telegram Notification
                try {
                    // Try to resolve the requester name from requester email
                    let updaterName = documentDetails.RequesterName || 'ระบบสาธารณะ';
                    if (documentDetails.RequesterEmail) {
                        const userRes = await fetch(`${FIREBASE_DB_URL}/Users/${encodeEmail(documentDetails.RequesterEmail)}.json`);
                        const userData = await userRes.json();
                        if (userData && userData.Name) {
                            updaterName = userData.Name;
                        }
                    }

                    const formattedTime = formatDateTime(timestamp);
                    const telegramMsg = `📦 ผู้ขอได้รับอะไหล่แล้ว (สแกน QR) 📦\n\n` +
                                        `เลขที่เอกสาร: ${docId}\n` +
                                        `ลูกค้า: ${documentDetails.CustomerName || '-'}\n` +
                                        `ผู้รับ: ${updaterName}\n` +
                                        `เวลา: ${formattedTime}`;

                    await sendTelegramNotification(telegramMsg);
                } catch (tErr) {
                    console.error("Failed sending Telegram Alert:", tErr);
                }

                Swal.close();
                Swal.fire({
                    icon: 'success',
                    title: 'บันทึกสำเร็จ!',
                    text: 'ยืนยันการรับสินค้าเสร็จเรียบร้อยแล้ว',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    // Reload data
                    fetchDocumentData(docId);
                    // Clear inputs
                    selectedImageBase64 = null;
                    document.getElementById('camera-file-input').value = '';
                    document.getElementById('photo-preview-container').classList.add('hidden');
                });

            } catch (err) {
                console.error("Confirm receipt submission failed:", err);
                Swal.close();
                Swal.fire({
                    icon: 'error',
                    title: 'ผิดพลาด',
                    text: 'ไม่สามารถยืนยันการรับอะไหล่ได้ กรุณาลองใหม่อีกครั้ง'
                });
            }
        }

        // Send Telegram helper
        async function sendTelegramNotification(message) {
            try {
                const tokenRes = await fetch(`${FIREBASE_DB_URL}/Settings/telegramBotToken.json`);
                const tokenData = await tokenRes.json();
                const chatRes = await fetch(`${FIREBASE_DB_URL}/Settings/telegramChatId.json`);
                const chatData = await chatRes.json();
                
                const token = (tokenData && tokenData.Value) ? tokenData.Value : "7944082320:AAEu39fL6Ooxn9rzF1vpd93yqbhvSqd1i60";
                const chatId = (chatData && chatData.Value) ? chatData.Value : "-4883937644";
                
                const url = `https://api.telegram.org/bot${token}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });
            } catch (e) {
                console.error("Telegram notification failed:", e);
            }
        }

        // Image compression helper using Canvas
        function compressImage(file, maxWidth, maxHeight, quality, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                    callback(compressedBase64);
                };
            };
        }

        // Helper to encode emails for Firebase paths (replacing dots with commas)
        function encodeEmail(email) {
            if (!email) return "";
            return email.replace(/\./g, ',');
        }

        // Formats a date string to Thai readable format
        function formatDateTime(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            
            if (isNaN(date.getTime())) {
                return dateString;
            }
            
            const options = {
                year: 'numeric', month: 'numeric', day: 'numeric',
                hour: '2-digit', minute: '2-digit',
                hour12: false,
                timeZone: 'Asia/Bangkok'
            };
            return date.toLocaleString('th-TH', options).replace(', ', ' : ');
        }

        // Display a full-screen SweetAlert2 error
        function showError(title, message) {
            document.getElementById('content-loading').classList.add('hidden');
            document.getElementById('content-container').classList.add('hidden');
            Swal.fire({
                icon: 'error',
                title: title,
                text: message,
                allowOutsideClick: false,
                showConfirmButton: false
            });
        }
    </script>
</body>
</html>
